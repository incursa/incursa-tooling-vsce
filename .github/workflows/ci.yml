name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run release:check
      - uses: actions/upload-artifact@v4
        with:
          name: incursa-tooling-vsix
          path: |
            artifacts/incursa-tooling-vsce.vsix
            artifacts/SHA256SUMS.txt
            artifacts/PACKAGE-INFO.json
            artifacts/VSIX-CONTENTS.json

