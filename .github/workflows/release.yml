name: Release

on:
  workflow_dispatch:
    inputs:
      publish_marketplace:
        description: Publish the verified VSIX to Visual Studio Marketplace
        type: boolean
        required: true
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run release:check
      - uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: artifacts/
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/incursa-tooling-vsce.vsix
            artifacts/SHA256SUMS.txt
            artifacts/PACKAGE-INFO.json
            artifacts/VSIX-CONTENTS.json

  marketplace:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_marketplace
    needs: package
    runs-on: ubuntu-latest
    environment: marketplace
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: release-package
          path: artifacts
      - run: npm ci
      - name: Require Marketplace secret
        shell: bash
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "VSCE_PAT is required in the marketplace environment." >&2
            exit 1
          fi
      - name: Publish verified VSIX
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx vsce publish --packagePath artifacts/incursa-tooling-vsce.vsix

